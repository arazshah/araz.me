{% load ui %}<article class="card card-link">
  <div class="card-top"><span class="eyebrow">{{ p.kind }}</span><span class="status s-{{ p.status }}">{% status_label p.status %}</span></div>
  <h3><a class="stretch" href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
  <p class="muted">{{ p.tagline }}</p>
  <ul class="tags">{% for s in p.stack_list|slice:":5" %}<li>{{ s }}</li>{% endfor %}</ul>
</article>
