services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: araz_me
      POSTGRES_USER: araz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araz -d araz_me"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://araz:${POSTGRES_PASSWORD}@db:5432/araz_me?schema=public

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://araz:${POSTGRES_PASSWORD}@db:5432/araz_me?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://araz.me}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
    volumes:
      - media_data:/app/public/uploads
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_data:
