services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in Coolify environment variables}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-araz.me,www.araz.me}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://araz.me,https://www.araz.me}
      SITE_URL: ${SITE_URL:-https://araz.me}
      ADMIN_URL: ${ADMIN_URL:-panel/}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Araz@Change-Me-2026}
    volumes:
      - araz_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/robots.txt')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  araz_data:
